openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API dla systemu ośrodka nadmorskiego
servers:
  - url: /api
    description: Base API path
tags:
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: health
    description: Health operations
  - name: public
    description: Publiczne endpointy dla gości
  - name: admin
    description: Panel administratora
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── PUBLIC ───────────────────────────────────────────────────────────────────

  /settings:
    get:
      operationId: getSettings
      tags: [public]
      summary: Pobierz ustawienia strony (publiczne)
      responses:
        "200":
          description: Ustawienia strony
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /rooms:
    get:
      operationId: listRooms
      tags: [public]
      summary: Lista aktywnych pokoi/apartamentów
      responses:
        "200":
          description: Lista pokoi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/{id}:
    get:
      operationId: getRoom
      tags: [public]
      summary: Szczegóły pokoju
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pokój
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Nie znaleziono

  /gallery:
    get:
      operationId: listGallery
      tags: [public]
      summary: Galeria zdjęć ośrodka
      responses:
        "200":
          description: Lista zdjęć
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"

  /availability:
    get:
      operationId: getAvailability
      tags: [public]
      summary: Dostępność pokoju
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Bloki zajętości
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityBlock"

  /inquiries:
    post:
      operationId: submitInquiry
      tags: [public]
      summary: Wyślij zapytanie / prośbę o rezerwację
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Zapytanie zostało wysłane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Błędne dane

  # ─── ADMIN AUTH ───────────────────────────────────────────────────────────────

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Logowanie administratora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Zalogowano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Nieprawidłowe dane

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Wylogowanie
      responses:
        "200":
          description: Wylogowano

  /admin/me:
    get:
      operationId: adminGetMe
      tags: [admin]
      summary: Aktualny administrator
      responses:
        "200":
          description: Zalogowany admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Niezalogowany

  # ─── ADMIN SETTINGS ──────────────────────────────────────────────────────────

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Pobierz ustawienia (admin)
      responses:
        "200":
          description: Ustawienia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSiteSettings"
    put:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Zaktualizuj ustawienia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSiteSettingsInput"
      responses:
        "200":
          description: Zaktualizowane ustawienia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSiteSettings"

  # ─── ICAL ────────────────────────────────────────────────────────────────────

  /ical:
    get:
      operationId: getIcal
      tags: [public]
      summary: Eksport kalendarza iCal (tylko daty zajęcia, bez danych gości)
      responses:
        "200":
          description: Kalendarz iCal
          content:
            text/calendar:
              schema:
                type: string

  /admin/ical-import:
    post:
      operationId: adminIcalImport
      tags: [admin]
      summary: Importuj zajęte daty z Booking.com przez URL iCal i zapisz jako blokady dostępności
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IcalImportInput"
      responses:
        "200":
          description: Wynik importu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcalImportResult"

  # ─── ADMIN ROOMS ─────────────────────────────────────────────────────────────

  /admin/rooms:
    get:
      operationId: adminListRooms
      tags: [admin]
      summary: Lista wszystkich pokoi (admin)
      responses:
        "200":
          description: Pokoje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: adminCreateRoom
      tags: [admin]
      summary: Dodaj nowy pokój
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Nowy pokój
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /admin/rooms/{id}:
    get:
      operationId: adminGetRoom
      tags: [admin]
      summary: Szczegóły pokoju (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Pokój
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Nie znaleziono
    put:
      operationId: adminUpdateRoom
      tags: [admin]
      summary: Zaktualizuj pokój
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "200":
          description: Zaktualizowany pokój
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
    delete:
      operationId: adminDeleteRoom
      tags: [admin]
      summary: Usuń pokój
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  /admin/rooms/{id}/photos:
    post:
      operationId: adminAddRoomPhoto
      tags: [admin]
      summary: Dodaj zdjęcie do pokoju
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoInput"
      responses:
        "201":
          description: Zdjęcie dodane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPhoto"

  /admin/rooms/{id}/photos/{photoId}:
    delete:
      operationId: adminDeleteRoomPhoto
      tags: [admin]
      summary: Usuń zdjęcie pokoju
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: photoId
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  # ─── ADMIN GALLERY ───────────────────────────────────────────────────────────

  /admin/gallery:
    get:
      operationId: adminListGallery
      tags: [admin]
      summary: Galeria zdjęć (admin)
      responses:
        "200":
          description: Zdjęcia galerii
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
    post:
      operationId: adminAddGalleryPhoto
      tags: [admin]
      summary: Dodaj zdjęcie do galerii
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoInput"
      responses:
        "201":
          description: Zdjęcie dodane
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"

  /admin/gallery/{id}:
    delete:
      operationId: adminDeleteGalleryPhoto
      tags: [admin]
      summary: Usuń zdjęcie z galerii
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  # ─── ADMIN BOOKINGS ──────────────────────────────────────────────────────────

  /admin/bookings:
    get:
      operationId: adminListBookings
      tags: [admin]
      summary: Lista wszystkich rezerwacji i zapytań
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
      responses:
        "200":
          description: Rezerwacje
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /admin/bookings/{id}:
    get:
      operationId: adminGetBooking
      tags: [admin]
      summary: Szczegóły rezerwacji
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Rezerwacja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    put:
      operationId: adminUpdateBooking
      tags: [admin]
      summary: Zaktualizuj status rezerwacji
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Zaktualizowana rezerwacja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: adminDeleteBooking
      tags: [admin]
      summary: Usuń rezerwację
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  # ─── ADMIN AVAILABILITY ──────────────────────────────────────────────────────

  /admin/availability:
    get:
      operationId: adminListAvailability
      tags: [admin]
      summary: Lista bloków dostępności
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Bloki dostępności
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityBlock"
    post:
      operationId: adminCreateAvailability
      tags: [admin]
      summary: Zablokuj termin / oznacz jako zajęty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "201":
          description: Blok dodany
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityBlock"

  /admin/availability/{id}:
    delete:
      operationId: adminDeleteAvailability
      tags: [admin]
      summary: Usuń blok dostępności
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  # ─── ADMIN STATS ─────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Statystyki dashboardu
      responses:
        "200":
          description: Statystyki
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─── POSTS (AKTUALNOŚCI) ────────────────────────────────────────────────

  /posts:
    get:
      operationId: listPosts
      tags: [public]
      summary: Lista opublikowanych wpisów
      responses:
        "200":
          description: Wpisy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /admin/posts:
    get:
      operationId: adminListPosts
      tags: [admin]
      summary: Lista wszystkich wpisów
      responses:
        "200":
          description: Wpisy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: adminCreatePost
      tags: [admin]
      summary: Utwórz wpis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Utworzono
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /admin/posts/{id}:
    put:
      operationId: adminUpdatePost
      tags: [admin]
      summary: Zaktualizuj wpis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Zaktualizowano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: adminDeletePost
      tags: [admin]
      summary: Usuń wpis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Usunięto

  # ─── STORAGE ─────────────────────────────────────────────────────────────

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── SETTINGS ─────────────────────────────────────────────────────────────

    SiteSettings:
      type: object
      required:
        - id
        - resortName
        - theme
        - bookingMode
      properties:
        id:
          type: number
        resortName:
          type: string
        tagline:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        faviconUrl:
          type: ["string", "null"]
        petsAllowed:
          type: ["string", "null"]
          description: "'yes' lub 'no' — czy ośrodek akceptuje zwierzęta"
        petPrice:
          type: ["string", "null"]
          description: Cena za pobyt zwierzęcia (np. "30 zł / doba")
        heroImageUrl:
          type: ["string", "null"]
        heroImageUrl2:
          type: ["string", "null"]
        heroImageUrl3:
          type: ["string", "null"]
        googleCalendarUrl:
          type: ["string", "null"]
        googleAnalyticsId:
          type: ["string", "null"]
        googleMapsUrl:
          type: ["string", "null"]
        theme:
          type: string
          enum: [professional, exclusive, fun, family, rustic, modern]
        bookingMode:
          type: string
          enum: [inquiry, online, both]
        checkInTime:
          type: ["string", "null"]
        checkOutTime:
          type: ["string", "null"]

    AdminSiteSettings:
      allOf:
        - $ref: "#/components/schemas/SiteSettings"
        - type: object
          properties:
            bookingComIcalUrl:
              type: ["string", "null"]

    SiteSettingsInput:
      type: object
      properties:
        resortName:
          type: string
          minLength: 1
        tagline:
          type: string
        description:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        website:
          type: string
        whatsapp:
          type: string
        facebook:
          type: string
        logoUrl:
          type: string
        faviconUrl:
          type: string
        petsAllowed:
          type: string
          enum: ["yes", "no"]
        petPrice:
          type: string
        heroImageUrl:
          type: string
        heroImageUrl2:
          type: string
        heroImageUrl3:
          type: string
        googleCalendarUrl:
          type: string
        googleAnalyticsId:
          type: string
        googleMapsUrl:
          type: string
        theme:
          type: string
          enum: [professional, exclusive, fun, family, rustic, modern]
        bookingMode:
          type: string
          enum: [inquiry, online, both]
        checkInTime:
          type: string
        checkOutTime:
          type: string
        adminPassword:
          type: string

    AdminSiteSettingsInput:
      allOf:
        - $ref: "#/components/schemas/SiteSettingsInput"
        - type: object
          properties:
            bookingComIcalUrl:
              type: string

    IcalImportInput:
      type: object
      properties:
        url:
          type: string
          description: URL kalendarza iCal (opcjonalnie — jeśli brak, używa zapisanego w ustawieniach)

    IcalImportResult:
      type: object
      required: [ok, eventsFound, blocksWritten]
      properties:
        ok:
          type: boolean
        eventsFound:
          type: number
        blocksWritten:
          type: number
        rooms:
          type: number
        warning:
          type: string

    # ─── AUTH ────────────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1

    AdminUser:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean

    # ─── ROOM ────────────────────────────────────────────────────────────────

    Room:
      type: object
      required:
        - id
        - name
        - capacity
        - pricePerNight
        - isActive
        - sortOrder
        - amenities
        - photos
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        capacity:
          type: number
        pricePerNight:
          type: number
        minNights:
          type: number
        isActive:
          type: boolean
        sortOrder:
          type: number
        coverPhotoUrl:
          type: ["string", "null"]
        amenities:
          type: array
          items:
            type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/RoomPhoto"

    RoomInput:
      type: object
      required: [name, capacity, pricePerNight]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        capacity:
          type: number
          minimum: 1
        pricePerNight:
          type: number
          minimum: 0
        minNights:
          type: number
          minimum: 1
        isActive:
          type: boolean
        sortOrder:
          type: number
        coverPhotoUrl:
          type: string
        amenities:
          type: array
          items:
            type: string

    RoomPhoto:
      type: object
      required: [id, roomId, url, sortOrder]
      properties:
        id:
          type: number
        roomId:
          type: number
        url:
          type: string
        caption:
          type: ["string", "null"]
        sortOrder:
          type: number

    PhotoInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
        caption:
          type: string

    # ─── GALLERY ─────────────────────────────────────────────────────────────

    GalleryPhoto:
      type: object
      required: [id, url, sortOrder]
      properties:
        id:
          type: number
        url:
          type: string
        caption:
          type: ["string", "null"]
        sortOrder:
          type: number

    # ─── BOOKINGS ────────────────────────────────────────────────────────────

    Booking:
      type: object
      required:
        - id
        - guestName
        - guestEmail
        - guestPhone
        - checkIn
        - checkOut
        - guestsCount
        - status
        - type
        - createdAt
      properties:
        id:
          type: number
        roomId:
          type: ["number", "null"]
        roomName:
          type: ["string", "null"]
        guestName:
          type: string
        guestEmail:
          type: string
        guestPhone:
          type: string
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        guestsCount:
          type: number
        childrenCount:
          type: number
        message:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        type:
