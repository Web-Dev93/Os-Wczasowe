kind = "web"
previewPath = "/osrodek/"
title = "System Ośrodka Nadmorskiego"
description = "Kompletny system dla małych ośrodków wczasowych nad morzem. Zawiera stronę publiczną dla gości (pokoje, cennik, formularz rezerwacji/zapytania, galeria) oraz panel administratora do zarządzania pokojami, rezerwacjami, dostępnością i ustawieniami strony. System posiada 6 motywów wizualnych nawiązujących do morza: profesjonalny, ekskluzywny, wakacyjny, rodzinny, rustykalny i nowoczesny."
version = "1.0.0"
id = "artifacts/osrodek"
router = "path"

[[services]]
name = "web"
paths = [ "/osrodek/" ]
localPort = 18535

[services.development]
run = "pnpm --filter @workspace/osrodek run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/osrodek", "run", "build" ]
serve = "static"
publicDir = "artifacts/osrodek/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18535"
BASE_PATH = "/osrodek/"
