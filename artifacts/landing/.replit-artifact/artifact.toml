kind = "web"
previewPath = "/"
title = "Oferta — Strona dla Ośrodka"
description = "Sprzedażowy landing page dla agencji oferującej gotowe strony internetowe dla pensjonatów i ośrodków nadmorskich. Pokazuje 6 stylów do wyboru, opis funkcjonalności (panel admina, rezerwacje, galeria) oraz zachęca do kontaktu i zakupu."
version = "1.0.0"
id = "artifacts/landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18150"
BASE_PATH = "/"
